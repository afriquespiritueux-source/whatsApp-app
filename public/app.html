<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon WhatsApp</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
        .sidebar { width: 30%; background: white; border-right: 1px solid #ddd; overflow-y: auto; }
        .contact { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; }
        .contact:hover { background: #f5f5f5; }
        .contact.active { background: #e9edef; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; margin-right: 10px; }
        .chat-area { width: 70%; display: flex; flex-direction: column; }
        .chat-header { padding: 15px; background: #075e54; color: white; font-weight: bold; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; background: #e5ddd5; }
        .message { margin-bottom: 10px; padding: 10px; border-radius: 8px; max-width: 60%; clear: both; word-wrap: break-word; }
        .inbound { background: white; float: left; }
        .outbound { background: #dcf8c6; float: right; }
        .input-area { display: flex; padding: 10px; background: #f0f0f0; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; margin-right: 10px; }
        .input-area button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <!-- Liste des contacts -->
    </div>
    <div class="chat-area">
        <div class="chat-header" id="chat-header">Sélectionnez une conversation</div>
        <div class="messages" id="messages-area"></div>
        <div class="input-area" id="input-area" style="display: none;">
            <input type="text" id="message-input" placeholder="Tapez un message...">
            <button onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        // ⚠️ REMPLACEZ PAR VOS VRAIES INFOS SUPABASE
        const SUPABASE_URL = "https://nppaqxfbsjtiguakfkat.supabase.co";
        const SUPABASE_KEY = "sb_publishable_AndUnPjRmEA4Q7fsm037Kg_mkmFkN2W";
        let currentContact = null;

        // 1. Charger la liste des contacts
        async function chargerContacts() {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=contact_number,contact_name&order=created_at.desc`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();
            
            // Regrouper par numéro de téléphone
            const contacts = {};
            data.forEach(msg => {
                if (!contacts[msg.contact_number]) {
                    contacts[msg.contact_number] = msg.contact_name || msg.contact_number;
                }
            });

            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            for (const [numero, nom] of Object.entries(contacts)) {
                const div = document.createElement('div');
                div.className = 'contact';
                div.onclick = () => chargerConversation(numero, nom);
                div.innerHTML = `<div class="avatar"></div><div><b>${nom}</b><br><small>${numero}</small></div>`;
                sidebar.appendChild(div);
            }
        }

        // 2. Charger la conversation avec un contact
        async function chargerConversation(numero, nom) {
            currentContact = numero;
            document.getElementById('chat-header').innerText = nom;
            document.getElementById('input-area').style.display = 'flex';

            const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?contact_number=eq.${numero}&order=created_at.asc`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const messages = await response.json();

            const area = document.getElementById('messages-area');
            area.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.direction}`;
                div.innerText = msg.content;
                area.appendChild(div);
            });
            area.scrollTop = area.scrollHeight;
        }

        // 3. Envoyer un message via votre serveur Render
        async function envoyerMessage() {
            const input = document.getElementById('message-input');
            const texte = input.value;
            if (!texte) return;

            // Appel à votre serveur Render (qui enverra sur WhatsApp et enregistrera dans Supabase)
            await fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ to: currentContact, text: texte })
            });

            input.value = '';
            chargerConversation(currentContact, document.getElementById('chat-header').innerText);
        }

        window.onload = chargerContacts;
    </script>
</body>
</html>
